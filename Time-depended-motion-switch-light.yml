blueprint:
  name: MQTT Light Control
  description: Turn on/off a light with MQTT messages, and reduce brightness after 8 PM.
  domain: automation
  input:
    motion_sensor:
      name: Motion Sensor
      description: The motion sensor to trigger the light
      selector:
        entity:
          domain: binary_sensor
    mqtt_topic:
      name: MQTT Topic
      description: The MQTT topic to trigger the light
      selector:
        text:
    light_target:
      name: Light
      description: The light to control
      selector:
        target:
          entity:
            domain: light

trigger:
  - platform: state
    entity_id: !input motion_sensor
    to: 'on'
  - platform: mqtt
    topic: !input mqtt_topic

condition: []

action:
  - choose:
      - conditions:
          - condition: time
            after: '20:00:00'
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_pct: 50
      - conditions: []
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_pct: 100

mode: single
